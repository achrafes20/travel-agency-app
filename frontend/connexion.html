<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Connexion à votre espace Atlas Voyage" />
    <title>Connexion — Atlas Voyage</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/av.css" />
    <link rel="stylesheet" href="css/connexion.css" />
    <link rel="stylesheet" href="css/account.css?v=60" />
    <script src="js/shared/theme.js"></script>
  </head>
  <body>
    <a href="#login-panel-content" class="av-skip-link">Aller au formulaire de connexion</a>
    <main class="login-screen">
      <section class="login-photo">
        <div class="login-overlay">
          <a class="login-brand" href="accueil.html"><img src="images/logo.png" alt="Atlas Voyage" class="app-logo" /></a>
          <div>
            <p>EXPLOREZ · RÉSERVEZ · VOYAGEZ</p>
            <h1>Le Maroc<br />vous attend.</h1>
            <span>Une expérience authentique, pensée avec passion.</span>
          </div>
        </div>
      </section>

      <section class="login-panel" id="login-panel-content">
        <div class="login-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <a class="mobile-brand" href="accueil.html"><img src="images/logo.png" alt="Atlas Voyage" class="app-logo" /></a>
          </div>

          <div class="tabs" role="tablist">
            <button type="button" role="tab" id="tab-login" class="tab active" aria-selected="true" data-i18n="auth.tabs.login">Connexion</button>
            <button type="button" role="tab" id="tab-register" class="tab" aria-selected="false" data-i18n="auth.tabs.register">Créer un compte</button>
          </div>

          <div id="notice" class="notice hidden" role="alert"></div>

          <form id="login-form" novalidate>
            <span class="eyebrow">VOTRE ESPACE ATLAS VOYAGE</span>
            <h2>Bienvenue</h2>
            <label>Adresse email
              <div class="input-icon"><i data-lucide="mail"></i><input id="login-email" type="email" autocomplete="username" placeholder="vous@exemple.com" required /></div>
            </label>
            <label>Mot de passe
              <div class="input-icon"><i data-lucide="lock-keyhole"></i><input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required /><button type="button" class="toggle-password" aria-label="Afficher le mot de passe"><i data-lucide="eye"></i></button></div>
            </label>
            <div class="login-options"><label><input id="login-remember" type="checkbox" checked /> Se souvenir de moi</label></div>
            <button class="btn btn-primary" type="submit">Se connecter <i data-lucide="arrow-right"></i></button>
          </form>

          <form id="register-form" class="hidden" novalidate>
            <span class="eyebrow">NOUVEAU CLIENT</span>
            <h2>Créer un compte</h2>
            <p class="lead">Rejoignez Atlas Voyage pour réserver vos séjours.</p>
            <label>Nom complet
              <div class="input-icon"><i data-lucide="user"></i><input id="register-name" type="text" autocomplete="name" placeholder="Sarah Benali" required /></div>
            </label>
            <label>Adresse email
              <div class="input-icon"><i data-lucide="mail"></i><input id="register-email" type="email" autocomplete="username" placeholder="vous@exemple.com" required /></div>
            </label>
            <label>Mot de passe
              <div class="input-icon"><i data-lucide="lock-keyhole"></i><input id="register-password" type="password" autocomplete="new-password" placeholder="Mot de passe" required /><button type="button" class="toggle-password" aria-label="Afficher le mot de passe"><i data-lucide="eye"></i></button></div>
            </label>
            <button class="btn btn-primary" type="submit">Créer mon compte <i data-lucide="arrow-right"></i></button>
          </form>
        </div>
      </section>
    </main>

    <script src="js/core/config.js?v=21"></script>
    <script src="js/shared/i18n.js?v=14"></script>
    <script src="js/core/api.js?v=60"></script>
    <script src="js/core/auth.js?v=60"></script>
    <script src="js/core/uploader.js?v=61"></script>
    <script src="js/core/account.js?v=60"></script>
    <script src="js/pages/connexion.page.js?v=60"></script>
    <script>
      if (window.I18n) {
        I18n.init({ namespaces: ['common', 'auth', 'validation', 'errors'] }).then(() => {
          I18n.applyTranslations(document);
        });
        window.addEventListener('i18n:change', () => {
          I18n.applyTranslations(document);
        });
      }
    </script>
  </body>
</html>
