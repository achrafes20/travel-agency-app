<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atlas Voyage — Espace Agent" />
    <title>Atlas Voyage · Espace Agent</title>
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <link rel="stylesheet" href="../css/av.css" />
    <script src="../js/shared/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              atlas: {
                navy: "#0A2A6B",
                deep: "#071C48",
                amber: "#FFB400",
                canvas: "#F4F5F7",
                ink: "#0F1B3D",
                muted: "#6B7280",
                pale: "#E8F0FE",
              },
            },
            fontFamily: {
              sans: ["Poppins", "sans-serif"],
              display: ["Montserrat", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/agent.css?v=3" />
    <script src="../js/core/auth.js?v=60"></script>
    <script>Auth.requireRole("AGENT");</script>
    <link rel="stylesheet" href="../css/bookings.css?v=1">
    <link rel="stylesheet" href="../css/table-pagination.css?v=1">
    <link rel="stylesheet" href="../css/payments.css?v=31">
    <link rel="stylesheet" href="../css/notifications.css?v=40">
    <link rel="stylesheet" href="../css/stats.css?v=50">
    <script id="atlas-chartjs" src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" defer></script>
    <link rel="stylesheet" href="../css/account.css?v=60">
    <link rel="stylesheet" href="../css/tickets.css?v=1">
  </head>
  <body class="bg-atlas-canvas text-atlas-ink antialiased">
    <a href="#main-content" class="av-skip-link">Aller au contenu principal</a>
    <div id="agent-app" class="app-shell">
      <aside id="sidebar" class="sidebar">
        <button class="logo" data-page="dashboard">
          <img src="../images/logo.png" alt="Atlas Voyage" class="app-logo" />
        </button>
        <nav id="main-nav"></nav>
        <button class="user-panel" data-page="profile">
          <span class="avatar amber" id="user-initials">NE</span>
          <span><strong id="user-name">Nadia El Fassi</strong><small>Agent</small></span>
          <span data-icon="more"></span>
        </button>
      </aside>

      <div id="workspace" class="workspace">
        <header class="topbar">
          <div class="topbar-left">
            <button id="sidebar-toggle" class="icon-button" aria-label="Replier le menu"><span data-icon="menu"></span></button>
            <div class="breadcrumb"><span>Espace agent</span><span data-icon="chevron-right"></span><strong id="breadcrumb-label">Tableau de bord</strong></div>
          </div>
          <div class="top-actions">
            <div id="agent-i18n-container" class="flex items-center gap-2"></div>
            <label class="quick-search"><span data-icon="search"></span><input placeholder="Rechercher une référence BK-…" /></label>
            <div class="notification-wrap">
              <button id="notification-button" class="icon-button" aria-label="Notifications"><span data-icon="bell"></span></button>
              <div id="notification-dropdown" class="notification-dropdown hidden"></div>
            </div>
            <button class="account-button" data-page="profile"><span class="avatar amber" id="account-initials">NE</span><span><strong id="account-name">Nadia E.</strong><small>Agent</small></span><span data-icon="chevron-down"></span></button>
            <button id="logout-button" class="icon-button" aria-label="Déconnexion" title="Déconnexion"><span data-icon="logout"></span></button>
          </div>
        </header>

        <main id="main-content" class="main-body">
          <div id="page-content" class="page-content"></div>
        </main>
      </div>
    </div>

    <div id="modal-container"></div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="../js/core/config.js?v=21"></script>
    <script src="../js/core/api.js?v=60"></script>
    <script src="../js/shared/format.js?v=90"></script>
    <script src="../js/shared/i18n.js?v=14"></script>
    <script src="../js/shared/currency.js?v=14"></script>
    <script src="../js/shared/geocoding.js?v=90"></script>
    <script src="../js/core/bookings.js?v=33"></script>
    <script src="../js/core/payments.js?v=33"></script>
    <script src="../js/core/notifications.js?v=40"></script>
    <script src="../js/core/stats.js?v=50"></script>
    <script src="../js/core/uploader.js?v=61"></script>
    <script src="../js/core/account.js?v=60"></script>
    <script src="../js/core/tickets.js?v=3"></script>
    <script src="./js/app.js?v=60"></script>
  </body>
</html>
