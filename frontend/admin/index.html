<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Espace administrateur Atlas Voyage" />
    <title>Atlas Voyage — Espace administrateur</title>
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <link rel="stylesheet" href="../css/av.css" />
    <script src="../js/shared/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="../css/admin.css" />
    <script src="../js/core/auth.js?v=60"></script>
    <script>Auth.requireRole("ADMIN");</script>
    <link rel="stylesheet" href="../css/bookings.css?v=1">
    <link rel="stylesheet" href="../css/table-pagination.css?v=1">
    <link rel="stylesheet" href="../css/payments.css?v=31">
    <link rel="stylesheet" href="../css/notifications.css?v=40">
    <link rel="stylesheet" href="../css/stats.css?v=50">
    <script id="atlas-chartjs" src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" defer></script>
    <link rel="stylesheet" href="../css/account.css?v=60">
    <link rel="stylesheet" href="../css/tickets.css?v=1">
  </head>
  <body class="admin-root">
    <a href="#main-content" class="av-skip-link">Aller au contenu principal</a>
    <div id="admin-app">
      <header class="topbar">
        <div id="brand-area" class="brand-area">
          <button id="sidebar-toggle" class="icon-btn" aria-label="Replier le menu"><i data-lucide="menu"></i></button>
          <button class="brand nav-link" data-page="dashboard">
            <img src="../images/logo.png" alt="Atlas Voyage" class="app-logo" />
          </button>
        </div>
        <span class="admin-caption">ESPACE ADMINISTRATEUR</span>
        <div class="global-search">
          <i data-lucide="search"></i>
          <input id="global-search" placeholder="Rechercher un utilisateur, une offre, une référence..." />
        </div>
        <div class="top-actions">
          <div id="admin-i18n-container" class="flex items-center gap-2"></div>
          <div class="popover-wrap">
            <button id="notification-toggle" class="icon-btn relative" aria-label="Notifications"><i data-lucide="bell"></i></button>
            <div id="notification-popover" class="popover notification-popover hidden"></div>
          </div>
          <span class="top-divider"></span>
          <div class="popover-wrap">
            <button id="account-toggle" class="account-trigger">
              <span class="avatar">AD</span><span><strong>Administrateur</strong><small>Espace admin</small></span><i data-lucide="chevron-down"></i>
            </button>
            <div id="account-popover" class="popover account-popover hidden">
              <button class="nav-link" data-page="profile"><i data-lucide="user"></i>Mon profil</button>
              <button class="nav-link" data-page="profile"><i data-lucide="key-round"></i>Changer le mot de passe</button>
              <hr />
              <button id="logout" class="danger-text"><i data-lucide="log-out"></i>Déconnexion</button>
            </div>
          </div>
        </div>
      </header>

      <aside id="sidebar" class="sidebar">
        <nav id="main-nav"></nav>
      </aside>

      <main id="main-content" class="main-content">
        <header id="page-header" class="page-header"></header>
        <div id="page-body" class="page-body"></div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-stack"></div>

    <script src="../js/core/config.js?v=21"></script>
    <script src="../js/core/api.js?v=60"></script>
    <script src="../js/shared/format.js?v=90"></script>
    <script src="../js/shared/i18n.js?v=14"></script>
    <script src="../js/shared/currency.js?v=14"></script>
    <script src="../js/shared/geocoding.js?v=90"></script>
    <script src="../js/core/bookings.js?v=33"></script>
    <script src="../js/core/payments.js?v=33"></script>
    <script src="../js/core/notifications.js?v=40"></script>
    <script src="../js/core/stats.js?v=50"></script>
    <script src="../js/core/uploader.js?v=61"></script>
    <script src="../js/core/account.js?v=60"></script>
    <script src="../js/core/tickets.js?v=3"></script>
    <script src="../js/core/favorites.js?v=80"></script>
    <script src="./js/app.js?v=61"></script>
  </body>
</html>
