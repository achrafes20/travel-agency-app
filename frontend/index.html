<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Atlas Voyage</title>
  </head>
  <body>
    <h1>Atlas Voyage</h1>
    <p id="status-result">Connexion au backend...</p>

    <script>
      fetch("http://localhost:8080/api/status")
        .then((r) => r.json())
        .then((data) => {
          document.getElementById("status-result").textContent =
            "Backend connecté : " + data.message;
        })
        .catch(() => {
          document.getElementById("status-result").textContent =
            "Backend indisponible.";
        });
    </script>
  </body>
</html>
