<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Espace fournisseur Atlas Voyage" />
    <title>Atlas Voyage — Espace fournisseur</title>
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <link rel="stylesheet" href="../css/av.css" />
    <script src="../js/shared/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Montserrat", "sans-serif"] },
            colors: {
              atlas: {
                navy: "#0A2A66",
                dark: "#07204F",
                royal: "#0B3A8C",
                amber: "#FFB800",
                page: "#F4F6F9",
                ink: "#0F1B3D",
                muted: "#667085",
                border: "#E5E9F0",
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/supplier.css?v=9" />
    <script src="../js/core/auth.js?v=60"></script>
    <script>Auth.requireRole("SUPPLIER");</script>
    <link rel="stylesheet" href="../css/bookings.css?v=1">
    <link rel="stylesheet" href="../css/table-pagination.css?v=1">
    <link rel="stylesheet" href="../css/payments.css?v=31">
    <link rel="stylesheet" href="../css/notifications.css?v=40">
    <link rel="stylesheet" href="../css/stats.css?v=50">
    <script id="atlas-chartjs" src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" defer></script>
    <link rel="stylesheet" href="../css/account.css?v=60">
    <link rel="stylesheet" href="../css/tickets.css?v=1">
  </head>
  <body class="min-w-[1180px] bg-atlas-page font-sans text-atlas-ink antialiased">
    <a href="#main-shell" class="av-skip-link">Aller au contenu principal</a>
    <div id="app-shell" class="min-h-screen">
      <header class="fixed inset-x-0 top-0 z-40 flex h-16 items-center justify-between bg-atlas-royal px-7 text-white">
        <div class="flex items-center gap-3">
          <button id="sidebar-toggle" class="grid h-10 w-10 place-items-center rounded-lg hover:bg-white/10" aria-label="Replier le menu"><i data-lucide="menu" class="h-5 w-5"></i></button>
          <button class="brand flex items-center gap-3" data-page="dashboard" aria-label="Atlas Voyage — Accueil">
            <img src="../images/logo.png" alt="Atlas Voyage" class="app-logo" />
          </button>
        </div>

        <div class="flex h-full items-center gap-4">
          <div id="supplier-i18n-container" class="flex items-center gap-2"></div>
          <div class="relative">
            <button id="notification-toggle" class="relative grid h-10 w-10 place-items-center rounded-lg bg-white/10 hover:bg-white/20" aria-label="Notifications">
              <i data-lucide="bell" class="h-5 w-5"></i>
            </button>
            <div id="notification-dropdown" class="dropdown-panel right-0 top-12 hidden w-[350px]"></div>
          </div>

          <div class="h-7 w-px bg-white/20"></div>

          <div class="relative">
            <button id="account-toggle" class="flex items-center gap-3 rounded-lg p-1 text-left hover:bg-white/10">
              <span class="grid h-9 w-9 place-items-center rounded-lg bg-atlas-amber text-xs font-bold text-atlas-navy" id="supplier-initials">KI</span>
              <span>
                <strong class="block text-[11px]" id="supplier-name">Karim Idrissi</strong>
                <small class="block text-[10px] text-white/70">Fournisseur</small>
              </span>
              <i data-lucide="chevron-down" class="h-4 w-4 text-white/70"></i>
            </button>
            <div id="account-dropdown" class="dropdown-panel right-0 top-14 hidden w-56">
              <div class="border-b border-gray-100 px-4 py-3">
                <p class="text-xs font-semibold text-gray-900" id="dropdown-name">Karim Idrissi</p>
                <p class="truncate text-[11px] text-gray-500" id="dropdown-email">karim@fournisseur.ma</p>
              </div>
              <div class="py-1">
                <button class="nav-btn flex w-full items-center gap-2 px-4 py-2 text-xs text-gray-700 hover:bg-gray-50" data-page="profile">
                  <i data-lucide="user" class="h-4 w-4"></i>Mon profil
                </button>
                <button class="nav-btn flex w-full items-center gap-2 px-4 py-2 text-xs text-gray-700 hover:bg-gray-50" data-page="security">
                  <i data-lucide="shield" class="h-4 w-4"></i>Sécurité
                </button>
              </div>
              <div class="border-t border-gray-100 py-1">
                <button id="logout" class="flex w-full items-center gap-2 px-4 py-2 text-xs text-red-600 hover:bg-red-50">
                  <i data-lucide="log-out" class="h-4 w-4"></i>Déconnexion
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <aside id="sidebar" class="fixed bottom-0 left-0 top-16 z-30 flex w-[260px] flex-col bg-atlas-navy px-4 py-6 text-white transition-all duration-300">
        <p class="px-4 pb-4 text-[9px] font-bold tracking-[0.18em] text-blue-300">ESPACE FOURNISSEUR</p>
        <nav id="sidebar-nav" class="space-y-1">
          <button class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Tableau de bord</span></button>
          <button class="nav-item" data-page="offers"><i data-lucide="briefcase-business"></i><span>Mes offres</span></button>
          <button class="nav-item" data-page="new-offer"><i data-lucide="circle-plus"></i><span>Nouvelle offre</span></button>
          <button class="nav-item" data-page="inventory"><i data-lucide="calendar-range"></i><span>Disponibilités</span></button>
          <button class="nav-item" data-page="bookings"><i data-lucide="calendar-days"></i><span>Réservations reçues</span></button>
          <button class="nav-item" data-page="tickets"><i data-lucide="messages-square"></i><span>Tickets de support</span></button>
          <button class="nav-item" data-page="notifications"><i data-lucide="bell"></i><span>Notifications</span><b data-notification-count hidden></b></button>
          <button class="nav-item" data-page="profile"><i data-lucide="building-2"></i><span>Profil fournisseur</span></button>
        </nav>

        <div class="help-card mt-auto rounded-xl border border-white/10 bg-white/[0.07] p-4">
          <span class="grid h-9 w-9 place-items-center rounded-lg bg-atlas-amber text-atlas-navy"><i data-lucide="circle-help" class="h-5 w-5"></i></span>
          <strong class="mt-3 block text-xs">Besoin d’aide ?</strong>
          <p class="mt-1 text-[10px] leading-5 text-blue-200">Notre équipe vous accompagne dans la gestion de vos offres.</p>
          <a href="../accueil.html" class="mt-3 flex items-center gap-1 text-[10px] font-bold text-atlas-amber">Voir le site public <i data-lucide="arrow-right" class="h-3 w-3"></i></a>
        </div>
      </aside>

      <main id="main-shell" class="min-h-screen ml-[260px] pt-16 transition-all duration-300">
        <div id="page-content" class="p-8"></div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="fixed bottom-6 right-6 z-[100]"></div>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="../js/core/config.js?v=21"></script>
    <script src="../js/core/api.js?v=60"></script>
    <script src="../js/shared/format.js?v=90"></script>
    <script src="../js/shared/i18n.js?v=14"></script>
    <script src="../js/shared/currency.js?v=14"></script>
    <script src="../js/shared/geocoding.js?v=90"></script>
    <script src="../js/core/bookings.js?v=33"></script>
    <script src="../js/core/payments.js?v=33"></script>
    <script src="../js/core/notifications.js?v=40"></script>
    <script src="../js/core/stats.js?v=50"></script>
    <script src="../js/core/uploader.js?v=61"></script>
    <script src="../js/core/account.js?v=60"></script>
    <script src="../js/core/tickets.js?v=3"></script>
    <script src="./js/app.js?v=60"></script>
  </body>
</html>
