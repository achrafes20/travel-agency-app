# H2 sert aux tests de services ; le DDL MySQL est vérifié séparément.
spring.datasource.url=jdbc:h2:mem:travel_agency_test_${random.uuid};DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
# Clé éphémère générée pour chaque contexte.
app.jwt.secret=${random.value}${random.value}
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500
app.seed.enabled=false
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.agence.voyage=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.hibernate.SQL=WARN
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
booking.jobs.enabled=false
app.scheduling.enabled=false
app.jobs.enabled=false
app.storage.local.root=${java.io.tmpdir}/atlas-test-${random.uuid}
app.mail.enabled=false
booking.voucher.secret=${random.value}${random.value}
payment.provider=sandbox
payment.webhook-secret=${random.value}${random.value}
payment.requests-per-minute=1000

app.security.password.bcrypt-cost=4
app.security.allow-bearer-header=true
app.security.cookie.secure=false
app.rate-limit.enabled=false
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.info.enabled=true
management.info.env.enabled=true
