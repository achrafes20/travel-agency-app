# Variables obligatoires, aucun repli local.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.seed.enabled=false
app.security.allow-bearer-header=${APP_SECURITY_ALLOW_BEARER_HEADER:false}
app.security.cookie.secure=${APP_SECURITY_COOKIE_SECURE:true}
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
logging.level.com.agence.voyage=INFO
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
booking.voucher.secret=${VOUCHER_SECRET}
payment.provider=${PAYMENT_PROVIDER}
payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET}
