# Configuration du serveur
server.port=8080

# Configuration de la base de donnees MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/travel_agency_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Configuration de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Execute schema.sql (src/main/resources) a chaque demarrage.
# Le script est idempotent (CREATE TABLE IF NOT EXISTS), donc sans danger pour les donnees existantes.
spring.sql.init.mode=always
