spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_agency_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Phase 6 : évolutions JPA en dev ; scripts SQL manuels en production (pas de V10).
spring.jpa.hibernate.ddl-auto=update
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# NON SECURISE : clé publique de développement, interdite en production.
app.jwt.secret=${JWT_SECRET:YXRsYXMtdm95YWdlLWRldi1zZWNyZXQtY2hhbmdlLW1lLTAxMjM0NTY3ODlhYmNkZWY=}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
app.seed.enabled=true
app.seed.password=${DEMO_PASSWORD:password123}
logging.level.com.agence.voyage=DEBUG
logging.level.org.hibernate.SQL=WARN
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
booking.voucher.secret=${VOUCHER_SECRET:change-me-dev-only-not-secure}
payment.provider=${PAYMENT_PROVIDER:sandbox}
# Secret PUBLIC DE DÉVELOPPEMENT, interdit en production.
payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:dev-only-change-me-please-32chars-min}

app.security.allow-bearer-header=true
app.security.cookie.secure=false
app.security.password.bcrypt-cost=10
app.rate-limit.auth.id-capacity=100
app.rate-limit.auth.ip-capacity=1000
app.rate-limit.api.ip-capacity=10000
