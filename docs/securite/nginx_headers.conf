# ==============================================================================
# Configuration Nginx Renforcée — Atlas Voyage
# Fichier : /etc/nginx/conf.d/atlas_voyage.conf ou inclusion nginx_headers.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Limitation de Débit (Rate Limiting Zones)
# ------------------------------------------------------------------------------
# Zone pour l'authentification (stricte) : 5 requêtes par seconde par IP
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Zone générale pour l'API : 20 requêtes par seconde par IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Format de statut personnalisé pour le rate limiting (HTTP 429 au lieu de 503)
limit_req_status 429;

# Masquer la signature de version Nginx
server_tokens off;

# ------------------------------------------------------------------------------
# 2. Redirection HTTP vers HTTPS Strict
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name atlasvoyage.ma www.atlasvoyage.ma;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 3. Serveur Principal HTTPS
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atlasvoyage.ma www.atlasvoyage.ma;

    # Certificats SSL/TLS
    ssl_certificate /etc/letsencrypt/live/atlasvoyage.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlasvoyage.ma/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/atlasvoyage.ma/chain.pem;

    # Protocoles TLS sécurisés uniquement (interdiction SSLv3, TLS 1.0, TLS 1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Taille maximale des requêtes (téléversement d'avatars et documents)
    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # En-têtes de Sécurité HTTP Globaux
    # --------------------------------------------------------------------------
    # HSTS : Forcer HTTPS pendant 1 an avec sous-domaines et inscription au preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prévention du reniflage MIME (MIME-type sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # Protection contre le détournement de clic (Clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Politique de Referrer : préserve le domaine d'origine sans fuite d'URL complète
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrictions d'accès aux fonctionnalités matérielles du navigateur
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy (CSP) durcie pour Atlas Voyage
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://geocoding-api.open-meteo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

    # --------------------------------------------------------------------------
    # Fichiers Statiques du Frontend
    # --------------------------------------------------------------------------
    root /var/www/atlas-voyage/frontend;
    index accueil.html;

    location / {
        try_files $uri $uri/ /accueil.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Cache agressif pour les assets immuables (images, CSS, JS versionnés)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --------------------------------------------------------------------------
    # Proxy vers l'API Backend Spring Boot
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Renforcement des cookies renvoyés par Spring Boot
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Lax";

        # Timeouts de connexion et lecture
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Désactivation du buffering pour les réponses en streaming
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # --------------------------------------------------------------------------
    # Protection Renforcée des Routes d'Authentification
    # --------------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080/api/auth/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Lax";
    }

    # --------------------------------------------------------------------------
    # Endpoints Actuator Spring Boot
    # --------------------------------------------------------------------------
    # Seuls /actuator/health et /actuator/info sont exposés publiquement
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_set_header Host $host;
    }

    location = /actuator/info {
        proxy_pass http://127.0.0.1:8080/actuator/info;
        proxy_set_header Host $host;
    }

    # Bloquer tout accès externe aux autres endpoints d'administration Actuator
    location /actuator/ {
        # Autoriser uniquement le réseau interne de supervision (ex: Prometheus / VPN Ops)
        allow 10.0.0.0/8;
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8080/actuator/;
        proxy_set_header Host $host;
    }
}

