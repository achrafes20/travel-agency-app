openapi: 3.0.3
info:
  title: Atlas Voyage API REST
  version: 3.0.0
  description: API officielle de réservation touristique au Maroc (Hôtels & Riads, Vols, Voitures, Transferts, Excursions). Toutes les transactions et calculs de prix réels sont strictement exécutés en Dirhams Marocains (MAD TTC). Les devises étrangères (EUR, USD, GBP) sont fournies à titre strictement indicatif.
  contact:
    name: Support Technique Atlas Voyage
    url: "https://example.ma"
    email: tech@atlasvoyage.ma
  license:
    name: Propriétaire Atlas Voyage S.A.R.L. - Tous droits réservés (À confirmer)
    url: "https://example.ma/legal"
servers:
  - 
      url: "http://localhost:8080"
    description: Serveur de Développement Local
  - 
      url: "https://api.example.ma"
    description: Serveur de Préproduction / Staging
  - 
      url: "https://api.atlasvoyage.ma"
    description: Serveur de Production
tags:
  - 
      name: Authentification
    description: Gestion des sessions, connexions et jetons de rafraîchissement
  - 
      name: Sécurité du Compte
    description: "Changement de mot de passe, vérification d'email et réinitialisation"
  - 
      name: Profils
    description: Gestion des profils clients et fiches fournisseurs
  - 
      name: Utilisateurs & RGPD
    description: "Administration des comptes, archivage, export RGPD et droit à l'oubli"
  - 
      name: Villes & Géocodage
    description: Villes touristiques marocaines et coordonnées géographiques
  - 
      name: Offres Touristiques
    description: Hébergements, vols, voitures, transferts et excursions
  - 
      name: Bundles & Forfaits
    description: Packs promotionnels et forfaits combinés par les agents
  - 
      name: Panier
    description: "Gestion du panier d'achats, articles et validation des dates"
  - 
      name: Codes Promo
    description: Gestion des réductions promotionnelles
  - 
      name: Réservations
    description: "Conversion du panier en réservation, annulation et bons d'échange (vouchers)"
  - 
      name: Paiements & Caisse
    description: Règlements sandbox en ligne, encaissement espèces et remboursements
  - 
      name: Webhook Paiements
    description: Notification asynchrone des passerelles de paiement bancaire
  - 
      name: Notifications
    description: Centre de notifications in-app et préférences de réception
  - 
      name: Favoris
    description: Gestion des listes de souhaits des voyageurs clients
  - 
      name: Tickets de Support
    description: "Assistance client, suivi des réclamations et messagerie d'assistance"
  - 
      name: Avis & Notations
    description: "Retours d'expérience certifiés après séjour, modération et réponses"
  - 
      name: Contact Public
    description: Formulaire de contact avec protection anti-spam par pot de miel
  - 
      name: Paramètres Système
    description: Configuration globale de la plateforme et mode maintenance
  - 
      name: Statistiques & KPIs
    description: Indicateurs de performance des 4 tableaux de bord et exports CSV
  - 
      name: Devises & Taux
    description: Taux de change indicatifs (EUR, USD, GBP) par rapport au MAD
  - 
      name: Fichiers & Images
    description: "Téléversement et distribution d'images et pièces jointes"
  - 
      name: Santé & Supervision
    description: "Sondes de disponibilité et métriques d'exploitation"
  - 
      name: "Journal d'Audit"
    description: "Traçabilité immuable des actions sensibles et export d'audit"
paths:
  /api/auth/change-password:
    post:
      tags:
        - Sécurité du Compte
      summary: Changer mon mot de passe et révoquer les anciennes sessions
      description: Endpoint contrôlé par `AccountSecurityController.change()`.
      operationId: AccountSecurityController_change_post__api_auth_change_password
      security:
        - 
        - 
      responses:
        200:
          description: Opération réalisée avec succès
        400:
          description: Requête invalide ou corps non conforme
        401:
          description: Non authentifié - Jeton absent ou expiré
        403:
          description: Accès refusé - Privilèges insuffisants pour cette ressource
        422:
          description: Erreur métier ou validation de règle échouée
        429:
          description: Limite de débit dépassée (Rate limit) - Consulter Retry-After
        500:
          description: Erreur interne du serveur Atlas Voyage
